<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quản lý sản phẩm – 3D Thăng Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2347;--navy2:#1B3A6E;--orange:#FF6A1F;--orange-d:#E5560F;--soft:#F1F5FB;--muted:#566581;--line:#DCE4F0;--bad:#C62828}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;color:var(--navy);background:var(--soft)}
h1,h2{font-family:"Bricolage Grotesque",sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.lay{background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 7px),linear-gradient(160deg,var(--navy),var(--navy2))}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.mk{width:52px;height:52px;border-radius:14px;background:var(--navy);display:grid;place-items:center;margin-bottom:14px}.mk svg{width:34px;fill:var(--orange)}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:30}
.lc{width:min(380px,100%);background:#fff;border-radius:20px;padding:28px 26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.lc h2{font-size:28px}.lc .sub{color:var(--muted);margin:2px 0 6px}
#lerr{color:var(--bad);font-size:14px;margin:10px 0 0}
.bar{position:sticky;top:0;z-index:5;color:#fff;box-shadow:0 4px 18px rgba(15,35,71,.25)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:12px 16px}
.bar .mk{width:40px;height:40px;margin:0;background:rgba(255,255,255,.1)}.bar .mk svg{width:26px}
.bar h1{flex:1;font-size:20px;line-height:1.1}.bar h1 small{display:block;font:400 12px "Be Vietnam Pro",sans-serif;opacity:.7;margin-top:2px}
.bar a{color:#fff;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:7px 14px;border-radius:99px}.bar a:hover{background:rgba(255,255,255,.12)}
.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--orange);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 6px 14px rgba(255,106,31,.3);transition:transform .15s,background .15s}
.btn:hover{background:var(--orange-d)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.ghost:hover{background:var(--soft)}
.btn.red{background:#fff;color:var(--bad);border:1px solid #F1C5C5;box-shadow:none}.btn.red:hover{background:#FDECEC}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.sv{background:#fff;border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:14px;padding:12px 14px}
.sv b{font:800 28px/1 "Bricolage Grotesque",sans-serif}.sv span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.tools{display:flex;gap:10px;margin-bottom:12px}.tools input{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 15px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.pc:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,35,71,.14)}
.ph{position:relative;aspect-ratio:1;background:var(--soft)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pc.off .ph img{filter:grayscale(1);opacity:.45}
.tag{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--orange);color:#fff}.tag.g{left:auto;right:10px;background:var(--navy)}
.pb{padding:12px;display:flex;flex-direction:column;flex:1}
.pb b{font-weight:600;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb small{color:var(--muted)}.pr{font:800 19px "Bricolage Grotesque",sans-serif;color:var(--orange-d);margin:4px 0 10px}
.acts{display:flex;gap:6px;margin-top:auto}.acts .btn{flex:1;padding:7px 4px;font-size:13px}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted)}
dialog{width:min(660px,100%);max-height:94vh;border:0;border-radius:20px;padding:0;color:var(--navy);box-shadow:0 30px 70px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(15,35,71,.6);backdrop-filter:blur(2px)}
dialog form{padding:0 20px 20px}dialog h2{margin:0 -20px 4px;padding:16px 20px;color:#fff;font-size:22px}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,106,31,.15)}
input[type=file]{border-style:dashed;background:var(--soft);cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;gap:20px;margin-top:6px}.chk label{display:flex;gap:8px;align-items:center;margin:8px 0 0}.chk input{width:auto}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.im{width:96px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.im img{display:block;width:96px;height:96px;object-fit:cover}
.im div{display:flex}.im button{flex:1;border:0;border-top:1px solid var(--line);background:#fff;padding:5px 0;cursor:pointer}.im button:hover{background:var(--soft)}
.im i{display:block;font-style:normal;font-size:11px;text-align:center;background:var(--orange);color:#fff}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#msg.on{opacity:1}#msg.bad{background:var(--bad)}
@media(max-width:520px){.g2{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.bar a{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="login" class="lay"><div class="lc"><div class="mk"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="30" width="24" height="6" rx="3"/><rect x="5" y="22" width="30" height="6" rx="3" opacity=".85"/><rect x="8" y="14" width="24" height="6" rx="3"/><rect x="13" y="6" width="14" height="6" rx="3" opacity=".85"/></svg></div><h2>3D Thăng Long</h2><p class="sub">Đăng nhập để quản lý sản phẩm.</p><label for="pw">Mật khẩu</label><input id="pw" type="password" autocomplete="current-password"><p id="lerr" hidden></p><button class="btn" id="go" style="width:100%;margin-top:16px">Đăng nhập</button></div></section>

<div id="app" hidden>
  <header class="bar lay"><div class="wrap"><div class="mk"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="30" width="24" height="6" rx="3"/><rect x="5" y="22" width="30" height="6" rx="3" opacity=".85"/><rect x="8" y="14" width="24" height="6" rx="3"/><rect x="13" y="6" width="14" height="6" rx="3" opacity=".85"/></svg></div><h1>3D Thăng Long<small>Quản lý sản phẩm</small></h1><a href="index.html" target="_blank" rel="noopener">Xem trang web</a></div></header>
  <main class="wrap">
    <div class="st" id="st"></div>
    <div class="tools"><input id="q" type="search" placeholder="Tìm theo tên hoặc nhóm" aria-label="Tìm sản phẩm"><button class="btn" id="add">Thêm sản phẩm</button></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="list"></div>
  </main>
</div>

<dialog id="dlg" aria-label="Sản phẩm"><form id="f" novalidate>
  <h2 id="dt" class="lay">Thêm sản phẩm</h2>
  <label for="n">Tên sản phẩm</label><input id="n" maxlength="80">
  <div class="g2">
    <div><label for="c">Nhóm</label><select id="c"></select><input id="c2" placeholder="Tên nhóm mới" maxlength="40" hidden style="margin-top:6px"></div>
    <div><label for="p">Giá (đồng)</label><input id="p" inputmode="numeric" placeholder="ví dụ 149000"></div>
    <div><label for="m">Chất liệu</label><input id="m" maxlength="30"></div>
    <div><label for="kl">Khối lượng (gram)</label><input id="kl" inputmode="numeric" placeholder="để tính phí giao và thời gian in"></div>
  </div>
  <label for="nt">Ghi chú ngắn (hiện dưới tên)</label><input id="nt" maxlength="90">
  <label for="d">Mô tả</label><textarea id="d" rows="4" maxlength="800"></textarea>
  <div class="g2"><div><label for="s">Số lượt đã bán (nếu muốn hiện)</label><input id="s" inputmode="numeric"></div></div>
  <div class="chk"><label><input type="checkbox" id="h"> Đánh dấu Hot</label><label><input type="checkbox" id="v"> Hiện trên web</label></div>
  <label>Ảnh (ảnh đầu tiên là ảnh đại diện)</label>
  <div class="imgs" id="imgs"></div>
  <input id="file" type="file" accept="image/*" multiple>
  <div class="foot"><button type="button" class="btn ghost" id="cancel">Hủy</button><button type="submit" class="btn" id="save">Lưu sản phẩm</button></div>
</form></dialog>
<div id="msg" role="status"></div>

<script>
var EP="https://script.google.com/macros/s/AKfycbzPy89WXerHikyzJOMgc50pbQV6r29hpG2tyVkprvsO51AI8SPiRkuo8WmkW69mdMo_7A/exec";
var BASE=["Đèn bàn","Đồ chơi","Phụ kiện","Gia dụng tiện ích"];
var $=function(s){return document.querySelector(s)},K="",P=[],E=null,busy=0;
try{K=sessionStorage.getItem("tlk")||""}catch(x){}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fold(x){return String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")}
function fmt(n){return Number(n).toLocaleString("vi-VN")+"đ"}
var tm;function say(t,bad){var m=$("#msg");m.textContent=t;m.className="on"+(bad?" bad":"");clearTimeout(tm);tm=setTimeout(function(){m.className=""},3200)}
function api(b){b.key=K;return fetch(EP,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw new Error(d.error||"Lỗi không rõ");return d})}
function load(){return api({action:"sp_list"}).then(function(d){P=d.products;draw()})}
function enter(){$("#login").hidden=true;$("#app").hidden=false}
function login(){
  K=$("#pw").value.trim();if(!K)return;$("#go").disabled=true;$("#lerr").hidden=true;
  load().then(function(){try{sessionStorage.setItem("tlk",K)}catch(x){}enter()}).catch(function(e){K="";var l=$("#lerr");l.textContent=/mật khẩu/i.test(e.message)?"Sai mật khẩu.":"Không kết nối được máy chủ. Kiểm tra lại đã deploy Code.gs bản mới chưa. ("+e.message+")";l.hidden=false}).then(function(){$("#go").disabled=false})
}
$("#go").onclick=login;$("#pw").onkeydown=function(e){if(e.key==="Enter")login()};
if(K){load().then(enter).catch(function(){K=""})}

var F="";
function stat(n,t){return'<div class="sv"><b>'+n+'</b><span>'+t+'</span></div>'}
function draw(){
  var q=fold($("#q").value),cs=[];P.forEach(function(p){if(cs.indexOf(p.cat)<0)cs.push(p.cat)});
  if(F&&cs.indexOf(F)<0)F="";
  $("#st").innerHTML=stat(P.length,"Sản phẩm")+stat(P.filter(function(p){return p.hot}).length,"Đang Hot")+stat(P.filter(function(p){return !p.show}).length,"Đang ẩn");
  $("#chips").innerHTML=[""].concat(cs).map(function(c){return'<button type="button" class="chip" data-f="'+esc(c)+'" aria-pressed="'+(c===F)+'">'+(esc(c)||"Tất cả")+'</button>'}).join("");
  var l=P.filter(function(p){return(!F||p.cat===F)&&(!q||fold(p.name+" "+p.cat).indexOf(q)>-1)});
  $("#list").innerHTML=l.length?l.map(function(p){return'<article class="pc'+(p.show?"":" off")+'"><div class="ph"><img src="'+esc(p.imgs[0]||"")+'" alt="" loading="lazy">'+(p.hot?'<span class="tag">Hot</span>':"")+(p.show?"":'<span class="tag g">Đang ẩn</span>')+'</div><div class="pb"><b>'+esc(p.name)+'</b><small>'+esc(p.cat)+" | SP"+p.id+'</small><div class="pr">'+fmt(p.price)+'</div><div class="acts"><button class="btn ghost" data-e="'+p.id+'">Sửa</button><button class="btn ghost" data-t="'+p.id+'">'+(p.show?"Ẩn":"Hiện")+'</button><button class="btn red" data-x="'+p.id+'">Xóa</button></div></div></article>'}).join(""):'<div class="empty">'+(P.length?"Không có sản phẩm khớp.":"Chưa có sản phẩm. Bấm Thêm sản phẩm để bắt đầu.")+"</div>"
}
$("#chips").onclick=function(e){var b=e.target.closest("[data-f]");if(!b)return;F=b.dataset.f;draw()};
$("#q").oninput=draw;
function find(id){return P.filter(function(p){return p.id==id})[0]}
$("#list").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)return edit(find(b.dataset.e));
  if(b.dataset.t){var p=find(b.dataset.t),c=JSON.parse(JSON.stringify(p));c.show=!p.show;b.disabled=true;return api({action:"sp_save",product:c}).then(function(){say(c.show?"Đã hiện sản phẩm":"Đã ẩn sản phẩm");return load()}).catch(function(x){say(x.message,1);b.disabled=false})}
  if(b.dataset.x){var d=find(b.dataset.x);if(!confirm("Xóa vĩnh viễn \""+d.name+"\"? Nếu chỉ muốn tạm dừng bán, hãy dùng nút Ẩn."))return;api({action:"sp_delete",id:d.id}).then(function(){say("Đã xóa");return load()}).catch(function(x){say(x.message,1)})}
};
$("#add").onclick=function(){edit(null)};

function cats(cur){var s=BASE.slice();P.forEach(function(p){if(s.indexOf(p.cat)<0)s.push(p.cat)});if(cur&&s.indexOf(cur)<0)s.push(cur);return s}
function edit(p){
  E=p?JSON.parse(JSON.stringify(p)):{id:0,show:true,mat:"PLA",imgs:[],cat:""};
  $("#dt").textContent=p?"Sửa sản phẩm":"Thêm sản phẩm";
  $("#c").innerHTML=cats(E.cat).map(function(c){return'<option>'+esc(c)+'</option>'}).join("")+'<option value="__new">Nhóm mới...</option>';
  $("#c").value=E.cat||BASE[0];$("#c2").hidden=true;$("#c2").value="";
  $("#n").value=E.name||"";$("#p").value=E.price||"";$("#m").value=E.mat||"PLA";$("#kl").value=E.kl||"";$("#nt").value=E.note||"";$("#d").value=E.desc||"";$("#s").value=E.sold||"";$("#h").checked=!!E.hot;$("#v").checked=E.show!==false;
  imgs();$("#dlg").showModal()
}
$("#c").onchange=function(){var n=this.value==="__new";$("#c2").hidden=!n;if(n)$("#c2").focus()};
$("#cancel").onclick=function(){$("#dlg").close()};
function imgs(){
  $("#imgs").innerHTML=E.imgs.map(function(u,i){return'<div class="im">'+(i?"":"<i>Ảnh đại diện</i>")+'<img src="'+esc(u)+'" alt=""><div><button type="button" data-l="'+i+'" aria-label="Chuyển trái">&lt;</button><button type="button" data-r="'+i+'" aria-label="Chuyển phải">&gt;</button><button type="button" data-d="'+i+'" aria-label="Xóa ảnh">x</button></div></div>'}).join("")
}
$("#imgs").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;var a=E.imgs,i;
  if(b.dataset.d!=null)a.splice(+b.dataset.d,1);
  else if(b.dataset.l!=null&&(i=+b.dataset.l)>0){a.splice(i-1,2,a[i],a[i-1])}
  else if(b.dataset.r!=null&&(i=+b.dataset.r)<a.length-1){a.splice(i,2,a[i+1],a[i])}
  imgs()
};
function shrink(f){return new Promise(function(ok,no){
  var im=new Image,u=URL.createObjectURL(f);
  im.onerror=function(){no(new Error("Không đọc được ảnh "+f.name))};
  im.onload=function(){
    var s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    function rd(b){var r=new FileReader;r.onload=function(){ok({mime:b.type,data:r.result.split(",")[1]})};r.readAsDataURL(b)}
    c.toBlob(function(b){if(b&&b.type==="image/webp")rd(b);else c.toBlob(function(j){j?rd(j):no(new Error("Không xử lý được ảnh"))},"image/jpeg",.88)},"image/webp",.85)
  };im.src=u})}
$("#file").onchange=function(){
  var fs=[].slice.call(this.files);this.value="";if(!fs.length)return;
  busy++;$("#save").disabled=true;var n=0,e=E;
  fs.reduce(function(pr,f){return pr.then(function(){say("Đang tải ảnh "+(++n)+"/"+fs.length+"...");return shrink(f).then(function(x){return api({action:"sp_upload",mime:x.mime,data:x.data})}).then(function(d){e.imgs.push(d.url);if(e===E)imgs()})})},Promise.resolve())
   .then(function(){say("Đã tải ảnh lên")}).catch(function(x){say(x.message,1)}).then(function(){if(!--busy)$("#save").disabled=false})
};
$("#f").onsubmit=function(ev){
  ev.preventDefault();
  var cat=$("#c").value==="__new"?$("#c2").value.trim():$("#c").value,name=$("#n").value.trim(),price=parseInt($("#p").value.replace(/\D/g,""),10);
  if(!name)return say("Nhập tên sản phẩm",1);if(!cat)return say("Chọn hoặc nhập nhóm sản phẩm",1);
  if(!price)return say("Nhập giá bán",1);if(!E.imgs.length)return say("Thêm ít nhất 1 ảnh",1);
  var o={id:E.id,show:$("#v").checked,name:name,cat:cat,price:price,mat:$("#m").value.trim()||"PLA",kl:parseInt($("#kl").value.replace(/\D/g,""),10)||null,note:$("#nt").value.trim(),desc:$("#d").value.trim(),sold:parseInt($("#s").value.replace(/\D/g,""),10)||null,hot:$("#h").checked,imgs:E.imgs};
  $("#save").disabled=true;
  api({action:"sp_save",product:o}).then(function(){$("#dlg").close();say("Đã lưu, trang web đã cập nhật");return load()}).catch(function(x){say(x.message,1)}).then(function(){$("#save").disabled=false})
};
</script>
</body>
</html>
