<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F2347">
<title>Đơn hàng – Thăng Long 3D</title>
<style>
:root{--navy:#0F2347;--navy2:#1b3a73;--orange:#FF6A1F;--orange-d:#E5560F;--bg:#EEF3FB;--card:#fff;--line:#DCE4F0;--muted:#5d6b86;--green:#1f9d6b;--blue:#2f6fed;--r:16px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);line-height:1.5}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---- Đăng nhập ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 15% 10%,#2a4f9a 0,transparent 60%),radial-gradient(700px 500px at 90% 90%,#ff6a1f55 0,transparent 60%),linear-gradient(160deg,#0F2347,#16305F)}
.lbox{width:min(400px,100%);background:#fff;border-radius:24px;padding:34px 30px 30px;box-shadow:0 30px 80px rgba(5,12,28,.45)}
.logo3{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.llogo{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 14px}
.lcube{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.logo3 i{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--orange),#ff9a5c);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900;font-size:19px;box-shadow:0 8px 20px #ff6a1f55}
.logo3 b{display:block;font-size:19px;letter-spacing:.02em;line-height:1.1}
.logo3 span{font-size:13px;color:var(--muted)}
.lbox h2{margin:0 0 4px;font-size:24px}
.lbox p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.pwf{position:relative}
.pwf input{width:100%;padding:14px 46px 14px 16px;border:2px solid var(--line);border-radius:14px;font-size:16px;background:#f8faff;transition:border-color .15s,box-shadow .15s}
.pwf input:focus{border-color:var(--orange);outline:0;box-shadow:0 0 0 4px #ff6a1f22;background:#fff}
.pwf button{position:absolute;right:6px;top:6px;bottom:6px;width:38px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:17px}
.err{color:#c0392b;font-size:14px;min-height:22px;margin:8px 2px 4px}
.go{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange-d));box-shadow:0 10px 24px #ff6a1f55;transition:transform .12s}
.go:hover{transform:translateY(-1px)}
.go:active{transform:none}

/* ---- Khung quản lý ---- */
.hd{background:linear-gradient(135deg,#0F2347,#1b3a73);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 4px 20px rgba(5,12,28,.25)}
.hd .in{max-width:1000px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.hd .logo3{margin:0;margin-right:auto}
.hd .logo3 b{font-size:17px}.hd .logo3 span{color:#b9c8e6}
.hd .lcube{width:42px;height:42px}
.ib{border:1.5px solid #ffffff44;background:#ffffff14;color:#fff;border-radius:11px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center;transition:background .15s}
.ib:hover{background:#ffffff2b}
.ib.sp svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.main{max-width:1000px;margin:0 auto;padding:20px 18px 80px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.st{background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);position:relative;overflow:hidden}
.st::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--navy))}
.st small{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.st b{display:block;font-size:26px;line-height:1.2;margin-top:2px}
.st.n{--c:var(--orange)}.st.t{--c:var(--blue)}.st.m{--c:var(--green)}.st.a{--c:var(--navy)}
.st.n.hot b{color:var(--orange-d)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0 14px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14.5px}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;box-shadow:0 4px 12px #0f234744}
.seg .c{display:inline-block;margin-left:6px;background:var(--orange);color:#fff;border-radius:99px;font-size:12px;padding:0 7px}
.seg button[aria-pressed=true] .c{background:#fff;color:var(--navy)}
.srch{flex:1;min-width:180px;position:relative}
.srch input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:15px}
.srch input:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 4px #ff6a1f22}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pall{border:0;border-radius:13px;padding:11px 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange-d));box-shadow:0 8px 20px #ff6a1f44;display:inline-flex;gap:8px;align-items:center}
.pall:disabled{background:#c5cfe2;box-shadow:none;cursor:not-allowed}
.msg{padding:50px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.msg big{display:block;font-size:42px;margin-bottom:6px}

.ord{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;display:grid;grid-template-columns:6px 1fr;overflow:hidden;box-shadow:0 2px 10px rgba(15,35,71,.05);transition:box-shadow .15s,transform .15s}
.ord:hover{box-shadow:0 10px 28px rgba(15,35,71,.12);transform:translateY(-1px)}
.ord .sb{background:#b8c4dc}
.ord.new .sb{background:linear-gradient(var(--orange),#ffb184)}
.ord.new{border-color:#ffc9a8}
.oc{padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:start}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;background:var(--navy2)}
.who h3{margin:0;font-size:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who .tel{color:var(--navy2);font-weight:600;text-decoration:none}
.who .tel:hover{color:var(--orange-d)}
.who .mt{font-size:13px;color:var(--muted);margin-top:1px}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#e8eef9;color:var(--navy2)}
.badge.nw{background:var(--orange);color:#fff;animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{box-shadow:0 0 0 6px #ff6a1f33}}
.badge.dn{background:#dff5ec;color:var(--green)}
.badge.cod{background:#fff0e6;color:var(--orange-d)}
.badge.ck{background:#e6eeff;color:var(--blue)}
.tot{text-align:right}
.tot b{display:block;font-size:22px;line-height:1.1}
.tot small{color:var(--muted);font-size:12px}
.bd{grid-column:1/-1;display:grid;gap:10px;margin-top:6px}
.ad{display:flex;gap:8px;color:#34456a;font-size:14.5px}
.ad svg{flex:none;margin-top:3px;color:var(--orange-d)}
.its{display:flex;flex-wrap:wrap;gap:7px}
.its span{background:#f1f5fc;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.its span b{color:var(--orange-d)}
.nt{background:#fff8e6;border:1px solid #ffe2a3;color:#7a5600;border-radius:10px;padding:6px 10px;font-size:14px}
.ac{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.pb{border:0;border-radius:11px;padding:9px 18px;font-weight:700;color:#fff;background:var(--navy);display:inline-flex;gap:7px;align-items:center;font-size:14.5px;text-decoration:none}
.pb:hover{background:var(--orange)}
.pb.or{background:linear-gradient(135deg,var(--orange),var(--orange-d))}
.pb.gh{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.pb.gh:hover{border-color:var(--orange);color:var(--orange-d);background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-weight:600}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hd .logo3 span{display:none}.ib span{display:none}
  .oc{grid-template-columns:auto 1fr}.tot{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:10px}
  .tot b{font-size:20px}
  .pall{width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== PHIẾU IN A5 ===== */
#bill{display:none}
.pg{width:132mm;margin:0 auto;color:#111;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:11pt;line-height:1.4;page-break-after:always;break-after:page;position:relative}
.pg:last-child{page-break-after:auto;break-after:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:10px;border-bottom:3px solid #0F2347}
.ph .sn{font-size:20pt;font-weight:800;letter-spacing:.02em;color:#0F2347;line-height:1.1}
.ph .sn b{color:#E5560F}
.ph .si{font-size:9.5pt;color:#444;margin-top:4px}
.ph .dn{text-align:right}
.ph .dn .t{font-size:13pt;font-weight:800;color:#0F2347;letter-spacing:.04em}
.ph .dn .m{display:inline-block;margin-top:4px;border:1.5px solid #0F2347;border-radius:4px;padding:2px 10px;font-weight:700;font-size:12pt}
.ph .dn .d{font-size:9.5pt;color:#444;margin-top:4px}
.bx{border:1.2px solid #0F2347;border-radius:6px;margin-top:10px;overflow:hidden}
.bx h4{margin:0;background:#0F2347;color:#fff;font-size:9pt;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bx .bd{padding:7px 10px}
.kv{display:grid;grid-template-columns:24mm 1fr;gap:2px 8px}
.kv span{color:#555}
.kv b{font-weight:600}
.kv .nm{font-size:13pt;font-weight:800}
.tb{width:100%;border-collapse:collapse;font-size:10.5pt}
.tb th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.05em;color:#444;border-bottom:1.2px solid #0F2347;padding:5px 8px}
.tb td{padding:6px 8px;border-bottom:1px dashed #bbb;vertical-align:top}
.tb .r{text-align:right;white-space:nowrap}
.tb .c{text-align:center;width:11mm}
.sm{display:flex;justify-content:space-between;padding:4px 8px;font-size:10.5pt}
.sm span{color:#555}
.gt{display:flex;justify-content:space-between;align-items:center;margin-top:10px;border:2px solid #0F2347;border-radius:6px;padding:8px 12px}
.gt span{font-size:10pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gt b{font-size:18pt;font-weight:800;color:#0F2347}
.pay{margin-top:6px;font-size:10pt;color:#333;text-align:right}
.nt{margin-top:10px;border:1.2px dashed #777;border-radius:6px;padding:6px 10px;font-size:10pt}
.ft{margin-top:14px;padding-top:8px;border-top:1px solid #bbb;text-align:center;font-size:9.5pt;color:#444}
.ft b{color:#0F2347;font-size:10.5pt}
@page{size:A5 portrait;margin:8mm}
@media print{
  body{background:#fff}
  #app,#login,.toast{display:none!important}
  #bill{display:block}
}
</style>

<script>
var $=function(s){return document.querySelector(s)};
var KEY="",ORD=[],known={},FLT="new",Q="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}return null}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2000)}
function fold(x){return String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")}

async function load(first){
  if(!APPS_URL){$("#list").innerHTML='<div class="msg"><big>⚙️</big>Chưa dán địa chỉ Apps Script vào dòng <b>APPS_URL</b> ở đầu file donhang.html.</div>';return false}
  var rf=$("#rf");rf.classList.add("sp");
  try{
    var r=await fetch(APPS_URL+"?key="+encodeURIComponent(KEY)+"&t="+Date.now());
    var j=await r.json();
    if(!j.ok){if(first)return false;$("#list").innerHTML='<div class="msg"><big>🔒</big>Sai mật khẩu hoặc chưa cho phép truy cập.</div>';return false}
    var fresh=j.orders.filter(function(o){return o.status==="Mới"&&!known[o.id]});
    if(!first&&fresh.length){beep();toast("Có "+fresh.length+" đơn mới!")}
    j.orders.forEach(function(o){known[o.id]=1});
    ORD=j.orders;render();
    var d=new Date();$("#upd").textContent="Cập nhật lúc "+d.toLocaleTimeString("vi-VN")+" · tự làm mới mỗi 30 giây";
    return true;
  }catch(e){
    if(!first)$("#list").innerHTML='<div class="msg"><big>📡</big>Không kết nối được. Kiểm tra mạng rồi bấm "Làm mới".</div>';
    return false
  }finally{rf.classList.remove("sp")}
}
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()}
function items(o){
  var out=[];String(o.sanpham||"").split("\n").forEach(function(l){
    l=l.trim();var m=l.match(/^(.*?)\s+x(\d+)\s*\(([^)]*)\)$/);
    if(m)out.push('<span>'+esc(m[1])+' <b>×'+esc(m[2])+'</b></span>')
  });
  return out.join("")||'<span>'+esc(String(o.sanpham||"").split("\n")[0])+'</span>'
}
function render(){
  var nn=ORD.filter(function(o){return o.status==="Mới"}).length,td=today(),tdo=ORD.filter(function(o){return String(o.time).indexOf(td)===0});
  $("#n1").textContent=nn;$("#s1").classList.toggle("hot",nn>0);
  $("#n2").textContent=tdo.length;
  $("#n3").textContent=tdo.reduce(function(a,o){return a+(Number(o.tong)||0)},0).toLocaleString("vi-VN")+"đ";
  $("#n4").textContent=ORD.length;
  var c=$("#c1");c.hidden=!nn;c.textContent=nn;
  $("#pall").disabled=!nn;$("#pt").textContent=nn?"In tất cả đơn mới ("+nn+")":"In tất cả đơn mới";
  document.title=(nn?"("+nn+") ":"")+"Đơn hàng – Thăng Long 3D";
  var q=fold(Q);
  var l=ORD.filter(function(o){
    if(FLT==="new"&&o.status!=="Mới")return false;if(FLT==="done"&&o.status==="Mới")return false;
    return!q||fold(o.ten+" "+o.sdt+" "+o.id+" "+o.diachi).indexOf(q)>-1
  });
  $("#list").innerHTML=l.length?l.map(card).join(""):'<div class="msg"><big>'+(FLT==="new"&&!q?"🎉":"🔎")+'</big>'+(q?"Không tìm thấy đơn phù hợp.":FLT==="new"?"Chưa có đơn mới. Khi khách đặt hàng, đơn sẽ hiện ở đây.":"Chưa có đơn nào.")+'</div>'
}
function card(o){
  var nw=o.status==="Mới",cod=/COD/i.test(o.thanhtoan||""),ph=phone(o.sdt),addr=[o.diachi,o.xa,o.tinh].filter(Boolean).join(", ");
  return'<article class="ord'+(nw?" new":"")+'"><div class="sb"></div><div class="oc">'
  +'<div class="av" aria-hidden="true">'+esc((String(o.ten||"?").trim().split(/\s+/).pop()||"?").charAt(0).toUpperCase())+'</div>'
  +'<div class="who"><h3>'+esc(o.ten)+'<span class="badge '+(nw?"nw":"dn")+'">'+(nw?"MỚI":"Đã in")+'</span><span class="badge '+(cod?"cod":"ck")+'">'+(cod?"COD":"Chuyển khoản")+'</span></h3><div class="mt"><a class="tel" href="tel:'+esc(ph)+'">'+esc(ph)+'</a> · '+esc(o.id)+' · '+esc(o.time)+'</div></div>'
  +'<div class="tot"><b>'+esc(o.tong?Number(o.tong).toLocaleString("vi-VN")+"đ":"")+'</b><small>'+(cod?"Thu khi nhận hàng":"Tổng thanh toán")+'</small></div>'
  +'<div class="bd"><div class="ad"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg><span>'+esc(addr)+'</span></div>'
  +'<div class="its">'+items(o)+'</div>'+(o.ghichu?'<div class="nt">📝 '+esc(o.ghichu)+'</div>':'')+'</div>'
  +'<div class="ac"><button class="pb or" data-p="'+esc(o.id)+'">🖨 In phiếu A5</button><a class="pb gh" href="tel:'+esc(ph)+'">📞 Gọi khách</a><button class="pb gh" data-cp="'+esc(o.id)+'">📋 Sao chép địa chỉ</button></div>'
  +'</div></article>'
}
function money(v){return v?Number(v).toLocaleString("vi-VN")+"đ":""}
function phone(p){p=String(p||"").trim();return/^[1-9]\d{8}$/.test(p)?"0"+p:p}

  var items=[],sub="",raw=[];

    l=l.trim();if(!l)return;
    var m=l.match(/^(.*?)\s+x(\d+)\s*\(([^)]*)\)$/);
    if(m)items.push({n:m[1],q:m[2],p:m[3]});
    else if(/^Tạm tính/i.test(l))sub=l.replace(/^Tạm tính:?\s*/i,"");

    if(/^Tổng thanh toán/.test(k)){tong=v;return}
    if(/Đang cập nhật/.test(v))return;
    if(/^Thời gian in/.test(k))return;
    ship.push([k,v])
  });
  var cod=/COD/i.test(o.thanhtoan||"");
  var total=o.tong?money(o.tong):tong;

  if(raw.length)rows+='<tr><td class="c"></td><td colspan="3">'+raw.map(esc).join("<br>")+'</td></tr>';
  var addr=[o.diachi,o.xa,o.tinh].filter(Boolean).join(", ");

function printList(l){
  if(!l.length)return;
  $("#bill").innerHTML=l.map(bill).join("");
  setTimeout(function(){
    window.print();
    l.forEach(function(o){
      if(o.status!=="Mới")return;
      o.status="Đã in";
      fetch(APPS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"mark",key:KEY,id:o.id})}).catch(function(){});
    });
    render();
  },150);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-p]");
  if(b){printList(ORD.filter(function(o){return o.id===b.dataset.p}));return}
  var c=e.target.closest("[data-cp]");
  if(c){var o=ORD.filter(function(x){return x.id===c.dataset.cp})[0];
    var t=o.ten+" - "+phone(o.sdt)+"\n"+[o.diachi,o.xa,o.tinh].filter(Boolean).join(", ");
    try{navigator.clipboard.writeText(t).then(function(){toast("Đã sao chép địa chỉ")},function(){toast("Không sao chép được")})}catch(x){toast("Không sao chép được")}return}
  var f=e.target.closest("[data-f]");
  if(f){FLT=f.dataset.f;document.querySelectorAll("[data-f]").forEach(function(x){x.setAttribute("aria-pressed",x===f)});render()}
});
$("#pall").onclick=function(){printList(ORD.filter(function(o){return o.status==="Mới"}).reverse())};
$("#q").addEventListener("input",function(){Q=this.value;render()});
$("#rf").onclick=function(){load()};
$("#lo").onclick=function(){store("tl_key",null);location.reload()};
$("#eye").onclick=function(){var p=$("#pw");p.type=p.type==="password"?"text":"password"};
function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},350)}catch(e){}}
async function enter(){
  $("#lerr").textContent="";
  if(await load(true)){store("tl_key",KEY);$("#login").hidden=true;$("#app").hidden=false;setInterval(function(){if(!document.hidden)load()},30000)}
  else{$("#login").hidden=false;$("#app").hidden=true;if(KEY)$("#lerr").textContent=APPS_URL?"Sai mật khẩu hoặc không kết nối được.":"";if(!APPS_URL){$("#login").hidden=true;$("#app").hidden=false;load()}}
}
$("#lgo").onclick=function(){KEY=$("#pw").value.trim();enter()};
$("#pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("#lgo").click()});
KEY=store("tl_key")||"";
if(KEY)enter();else{$("#login").hidden=!APPS_URL;if(!APPS_URL){$("#app").hidden=false;load()}}
</script>
